[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pricesim"
version = "1.0.0"
description = "Pricing and revenue scenario simulator: corrected price elasticity, demand uncertainty and Monte Carlo scenarios on real retail transactions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mekky" }]
dependencies = [
  "numpy>=2.0", "pandas>=2.2", "duckdb>=1.1", "pyfixest>=0.60", "scikit-learn>=1.5",
  "matplotlib>=3.10", "pyarrow>=16", "openpyxl>=3.1",
]

[project.optional-dependencies]
app = ["streamlit>=1.40"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]
